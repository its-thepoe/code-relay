<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coderelay Fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f5f2ec;
        color: #171717;
      }

      section {
        min-height: 760px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 92px 64px;
        background: #f5f2ec;
      }

      .hero {
        width: min(1120px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 0.82fr);
        align-items: center;
        gap: 48px;
      }

      h1 {
        margin: 0;
        max-width: 780px;
        font-size: clamp(56px, 7vw, 92px);
        line-height: 0.96;
        letter-spacing: 0;
      }

      p {
        max-width: 620px;
        margin: 24px 0 0;
        font-size: 20px;
        line-height: 1.55;
        color: #4f4a43;
      }

      a {
        width: fit-content;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 32px;
        padding: 12px 20px;
        border: 1px solid #171717;
        border-radius: 999px;
        color: #171717;
        text-decoration: none;
      }

      img {
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        border-radius: 18px;
        box-shadow: 0 28px 80px rgb(0 0 0 / 18%);
      }

      @media (max-width: 768px) {
        section {
          min-height: 720px;
          padding: 56px 24px;
        }

        .hero {
          grid-template-columns: 1fr;
          gap: 28px;
        }

        h1 {
          font-size: clamp(42px, 13vw, 64px);
        }
      }
    </style>
  </head>
  <body>
    <section data-framer-name="Hero Section">
      <div class="hero">
        <div>
          <h1>Launch Framer work as real React code.</h1>
          <p>
            Coderelay preserves layout, typography, assets, and handoff context
            so builders can keep moving in code.
          </p>
          <a href="https://example.com">Export section</a>
        </div>
        <img
          src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=80"
          alt="A polished workspace with desks and plants"
        />
      </div>
    </section>
  </body>
</html>
